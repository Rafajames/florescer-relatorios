<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florescer Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F1E6;
    --bg-alt: #ECE5D3;
    --panel: #FFFEF9;
    --ink: #232E27;
    --ink-soft: #5B6459;
    --primary: #2F4B3C;
    --primary-light: #6E8B76;
    --accent: #B8862E;
    --accent-soft: #EFDFBB;
    --border: #DCD3BC;
    --danger: #A6432B;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(35,46,39,0.06), 0 4px 16px rgba(35,46,39,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    color:var(--primary);
    margin:0;
  }
  #app{
    display:flex;
    min-height:100vh;
  }
  /* Sidebar */
  #sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--primary);
    color:#EFE9D8;
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  #brand{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  #brand .leaf{
    font-size:22px;
    line-height:1;
  }
  #brand .name{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:22px;
    color:#F6EFDD;
  }
  #brand .sub{
    font-size:11.5px;
    color:#B9C9BC;
    letter-spacing:.02em;
  }
  nav{display:flex; flex-direction:column; gap:4px;}
  nav button{
    all:unset;
    cursor:pointer;
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    color:#DCE6DD;
    transition:background .15s ease;
  }
  nav button:hover{ background:rgba(255,255,255,0.08); }
  nav button.active{
    background:rgba(255,255,255,0.14);
    color:#fff;
    font-weight:500;
  }
  #sidebar-footer{
    margin-top:auto;
    font-size:12px;
    color:#9FB0A2;
    border-top:1px solid rgba(255,255,255,0.12);
    padding-top:14px;
  }
  /* Main */
  #main{
    flex:1;
    padding:36px 44px;
    max-width:920px;
  }
  .eyebrow-free-header{
    margin-bottom:26px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .btn{
    all:unset;
    cursor:pointer;
    background:var(--primary);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:500;
    text-align:center;
  }
  .btn:hover{ background:#243C30; }
  .btn.secondary{
    background:transparent;
    color:var(--primary);
    border:1px solid var(--primary-light);
  }
  .btn.secondary:hover{ background:var(--bg-alt); }
  .btn.accent{ background:var(--accent); }
  .btn.accent:hover{ background:#9C7226; }
  .btn.danger{ background:transparent; color:var(--danger); border:1px solid #E3B7A9;}
  .btn.danger:hover{ background:#FBEEE9; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  input[type=text], input[type=date], textarea, select{
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    width:100%;
  }
  textarea{ resize:vertical; line-height:1.55; }
  label{ font-size:13px; color:var(--ink-soft); font-weight:500; display:block; margin-bottom:6px;}
  .field{ margin-bottom:16px; }
  .muted{ color:var(--ink-soft); font-size:13.5px; }
  .patient-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:8px; cursor:pointer; background:#fff;
    transition:border-color .15s ease;
  }
  .patient-item:hover{ border-color:var(--primary-light); }
  .patient-item .name{ font-weight:600; color:var(--ink); }
  .patient-item .count{ font-size:12.5px; color:var(--ink-soft); }
  .report-item{
    padding:12px 14px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:8px; cursor:pointer; background:#fff;
  }
  .report-item:hover{ border-color:var(--primary-light); }
  .report-item .title{ font-weight:600; font-size:14px; }
  .report-item .date{ font-size:12.5px; color:var(--ink-soft); }
  .badge{
    display:inline-block; font-size:11.5px; padding:3px 9px; border-radius:20px;
    background:var(--accent-soft); color:#7A5A18; font-weight:500;
  }
  .rec-dot{
    width:10px; height:10px; border-radius:50%; background:var(--danger);
    animation:pulse 1.2s infinite;
  }
  @keyframes pulse{ 0%{opacity:1;} 50%{opacity:.35;} 100%{opacity:1;} }
  #transcript-box{
    min-height:140px; max-height:260px; overflow-y:auto;
    white-space:pre-wrap;
  }
  .divider{ height:1px; background:var(--border); margin:20px 0; }
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft);
  }
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--primary);
    color:#fff; padding:12px 18px; border-radius:8px; font-size:13.5px;
    box-shadow:var(--shadow); opacity:0; transform:translateY(8px);
    transition:all .25s ease; pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  a.linklike{ color:var(--primary); text-decoration:underline; cursor:pointer; }
  ::selection{ background:var(--accent-soft); }
  @media (max-width: 720px){
    #app{ flex-direction:column; }
    #sidebar{ width:100%; flex-direction:row; align-items:center; padding:14px 16px; gap:14px;}
    #brand .sub{ display:none; }
    nav{ flex-direction:row; overflow-x:auto; }
    #sidebar-footer{ display:none; }
    #main{ padding:20px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="brand">
      <span class="leaf">🌱</span>
      <span class="name">Florescer Relatórios</span>
      <span class="sub" id="sidebar-professional-name" style="cursor:pointer; text-decoration:underline dotted;" title="Clique para editar">—</span>
    </div>
    <nav id="nav">
      <button data-view="patients">Pacientes</button>
      <button data-view="newSession">Nova sessão</button>
      <button data-view="period">Relatório por período</button>
    </nav>
    <div id="sidebar-footer">Dados salvos na nuvem do Claude. Não é um ambiente com segurança de nível clínico — evite dados totalmente identificáveis.</div>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- State & storage ---------------- */
const state = {
  professionalName: null,
  patients: [],
  reportsByPatient: {},
  currentView: 'patients',
  currentPatientId: null,
};

const SHARED = true;

// Dentro do Claude usa o armazenamento do artefato; no site (GitHub Pages) usa o localStorage do navegador.
const HAS_CLAUDE_STORAGE = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storeGet(key){
  try{
    if(HAS_CLAUDE_STORAGE){ const r = await window.storage.get(key, SHARED); return r ? JSON.parse(r.value) : null; }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }
  catch(e){ return null; }
}
async function storeSet(key, value){
  try{
    if(HAS_CLAUDE_STORAGE){ await window.storage.set(key, JSON.stringify(value), SHARED); }
    else { localStorage.setItem(key, JSON.stringify(value)); }
  }
  catch(e){ console.error('storage set failed', e); showToast('Erro ao salvar. Tente novamente.'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2400);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------------- Claude API call ---------------- */
async function callClaude(promptText){
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{ role: 'user', content: promptText }]
    })
  });
  if(!response.ok){
    if(!HAS_CLAUDE_STORAGE){ showToast('A geração por IA só está disponível dentro do Claude. Aqui você pode escrever o relatório manualmente.'); }
    throw new Error('Falha na chamada à IA (' + response.status + ')');
  }
  const data = await response.json();
  return (data.content || []).map(b => b.text || '').join('\n').trim();
}

/* ---------------- Init ---------------- */
async function init(){
  const config = await storeGet('florescer:config');
  if(config && config.professionalName){
    state.professionalName = config.professionalName;
  }
  const patients = await storeGet('florescer:patients');
  state.patients = patients || [];
  document.getElementById('sidebar-professional-name').textContent = state.professionalName ? state.professionalName : 'configurar...';

  document.querySelectorAll('#nav button').forEach(btn=>{
    btn.addEventListener('click', ()=> setView(btn.dataset.view));
  });

  document.getElementById('sidebar-professional-name').addEventListener('click', async ()=>{
    const novo = prompt('Seu nome (aparece nos relatórios):', state.professionalName || '');
    if(!novo || !novo.trim()) return;
    state.professionalName = novo.trim();
    await storeSet('florescer:config', { professionalName: state.professionalName });
    document.getElementById('sidebar-professional-name').textContent = state.professionalName;
    showToast('Nome atualizado.');
  });

  if(!state.professionalName){
    renderSetup();
  } else {
    setView('patients');
  }
}

function setView(view, opts={}){
  state.currentView = view;
  document.querySelectorAll('#nav button').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  if(view==='patients') renderPatients();
  if(view==='newSession') renderNewSession(opts.patientId || null);
  if(view==='period') renderPeriod();
  if(view==='patientDetail') renderPatientDetail(opts.patientId);
}

/* ---------------- Setup ---------------- */
function renderSetup(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="eyebrow-free-header">
      <h1>Bem-vindo ao Florescer Relatórios</h1>
      <p class="muted">Antes de começar, como podemos te chamar nos relatórios?</p>
    </div>
    <div class="card" style="max-width:420px;">
      <div class="field">
        <label>Seu nome (profissional responsável)</label>
        <input type="text" id="setup-name" placeholder="ex: Dra. Ana Ribeiro">
      </div>
      <button class="btn" id="setup-save">Começar</button>
    </div>
  `;
  document.getElementById('setup-save').addEventListener('click', async ()=>{
    const name = document.getElementById('setup-name').value.trim();
    if(!name){ showToast('Digite um nome para continuar.'); return; }
    state.professionalName = name;
    await storeSet('florescer:config', { professionalName: name });
    document.getElementById('sidebar-professional-name').textContent = name;
    setView('patients');
  });
}

/* ---------------- Patients list ---------------- */
async function renderPatients(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="eyebrow-free-header row" style="justify-content:space-between;">
      <h1>Pacientes</h1>
      <button class="btn" id="add-patient-btn">Novo paciente</button>
    </div>
    <div id="add-patient-card" class="card" style="display:none; max-width:420px;">
      <div class="field">
        <label>Nome ou identificação do paciente</label>
        <input type="text" id="new-patient-name" placeholder="ex: Paciente M.S. ou iniciais">
      </div>
      <div class="row">
        <button class="btn" id="confirm-add-patient">Adicionar</button>
        <button class="btn secondary" id="cancel-add-patient">Cancelar</button>
      </div>
    </div>
    <div id="patients-list"></div>
  `;
  document.getElementById('add-patient-btn').addEventListener('click', ()=>{
    document.getElementById('add-patient-card').style.display = 'block';
  });
  document.getElementById('cancel-add-patient').addEventListener('click', ()=>{
    document.getElementById('add-patient-card').style.display = 'none';
  });
  document.getElementById('confirm-add-patient').addEventListener('click', async ()=>{
    const name = document.getElementById('new-patient-name').value.trim();
    if(!name){ showToast('Digite um nome.'); return; }
    const patient = { id: uid(), name, createdAt: new Date().toISOString() };
    state.patients.push(patient);
    await storeSet('florescer:patients', state.patients);
    renderPatients();
    showToast('Paciente adicionado.');
  });

  const list = document.getElementById('patients-list');
  if(state.patients.length===0){
    list.innerHTML = `<div class="card empty-state">Nenhum paciente cadastrado ainda. Clique em "Novo paciente" para começar.</div>`;
    return;
  }
  for(const p of state.patients){
    const reports = state.reportsByPatient[p.id] || (await loadReports(p.id));
    const item = document.createElement('div');
    item.className = 'patient-item';
    item.innerHTML = `<div><div class="name">${escapeHtml(p.name)}</div><div class="count">${reports.length} relatório(s)</div></div><div class="muted">Ver →</div>`;
    item.addEventListener('click', ()=> setView('patientDetail', {patientId: p.id}));
    list.appendChild(item);
  }
}

async function loadReports(patientId){
  const key = 'florescer:reports:' + patientId;
  const reports = (await storeGet(key)) || [];
  state.reportsByPatient[patientId] = reports;
  return reports;
}
async function saveReports(patientId, reports){
  state.reportsByPatient[patientId] = reports;
  await storeSet('florescer:reports:' + patientId, reports);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- Patient detail ---------------- */
async function renderPatientDetail(patientId){
  const patient = state.patients.find(p=>p.id===patientId);
  if(!patient){ setView('patients'); return; }
  const reports = await loadReports(patientId);
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="eyebrow-free-header">
      <a class="linklike" id="back-link">← Pacientes</a>
      <h1 style="margin-top:8px;">${escapeHtml(patient.name)}</h1>
      <p class="muted">Cadastrado em ${fmtDate(patient.createdAt)}</p>
    </div>
    <div class="row" style="margin-bottom:18px;">
      <button class="btn" id="new-session-for-patient">Nova sessão para este paciente</button>
      <button class="btn secondary" id="rename-patient">Editar nome</button>
      <button class="btn danger" id="delete-patient">Remover paciente</button>
    </div>
    <h3 style="margin-bottom:10px;">Relatórios de sessão</h3>
    <div id="reports-list"></div>
  `;
  document.getElementById('back-link').addEventListener('click', ()=> setView('patients'));
  document.getElementById('new-session-for-patient').addEventListener('click', ()=> setView('newSession', {patientId}));
  document.getElementById('rename-patient').addEventListener('click', async ()=>{
    const novoNome = prompt('Novo nome do paciente:', patient.name);
    if(!novoNome || !novoNome.trim()) return;
    patient.name = novoNome.trim();
    await storeSet('florescer:patients', state.patients);
    showToast('Nome atualizado.');
    renderPatientDetail(patientId);
  });
  document.getElementById('delete-patient').addEventListener('click', async ()=>{
    if(!confirm('Remover este paciente e todos os relatórios associados? Esta ação não pode ser desfeita.')) return;
    state.patients = state.patients.filter(p=>p.id!==patientId);
    await storeSet('florescer:patients', state.patients);
    showToast('Paciente removido.');
    setView('patients');
  });

  const list = document.getElementById('reports-list');
  if(reports.length===0){
    list.innerHTML = `<div class="card empty-state">Nenhum relatório ainda para este paciente.</div>`;
    return;
  }
  const sorted = [...reports].sort((a,b)=> new Date(b.date) - new Date(a.date));
  list.innerHTML='';
  for(const r of sorted){
    const item = document.createElement('div');
    item.className = 'report-item';
    const statusBadge = r.reviewed
      ? `<span class="badge" style="background:#DCEAD9; color:#2F4B3C;">Revisado</span>`
      : `<span class="badge">Rascunho</span>`;
    item.innerHTML = `<div><div class="title">${escapeHtml(r.title)}</div><div class="date">${fmtDate(r.date)}</div></div>${statusBadge}`;
    item.style.display = 'flex';
    item.style.justifyContent = 'space-between';
    item.style.alignItems = 'center';
    item.addEventListener('click', ()=> renderReportViewer(patientId, r.id));
    list.appendChild(item);
  }
}

/* ---------------- Report viewer / editor ---------------- */
async function renderReportViewer(patientId, reportId){
  const patient = state.patients.find(p=>p.id===patientId);
  const reports = state.reportsByPatient[patientId] || await loadReports(patientId);
  const report = reports.find(r=>r.id===reportId);
  if(!report){ setView('patientDetail', {patientId}); return; }
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="eyebrow-free-header">
      <a class="linklike" id="back-link">← ${escapeHtml(patient.name)}</a>
      <div class="row" style="justify-content:space-between; margin-top:8px;">
        <h1>${escapeHtml(report.title)}</h1>
        <span class="badge">${fmtDate(report.date)}</span>
      </div>
    </div>
    <div class="card">
      <p class="muted" style="margin-bottom:12px;">⚠️ Este texto pode ter sido gerado ou ajudado por IA — revise com atenção antes de considerá-lo final.</p>
      <label>Relatório (editável)</label>
      <textarea id="report-editor" rows="16">${escapeHtml(report.report)}</textarea>
      <div class="row" style="margin-top:14px; justify-content:space-between;">
        <label style="display:flex; align-items:center; gap:8px; margin:0; cursor:pointer;">
          <input type="checkbox" id="reviewed-check" style="width:auto;" ${report.reviewed ? 'checked' : ''}>
          Marcar como revisado
        </label>
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="btn" id="save-report-edit">Salvar alterações</button>
        <button class="btn secondary" id="export-word">Exportar Word (.doc)</button>
        <button class="btn secondary" id="export-pdf">Exportar PDF</button>
        <button class="btn danger" id="delete-report">Excluir relatório</button>
      </div>
    </div>
    <details class="card">
      <summary style="cursor:pointer; font-weight:500;">Ver transcrição original da sessão (para auditoria)</summary>
      <div style="margin-top:12px; white-space:pre-wrap;" class="muted">${escapeHtml(report.transcript || '(sem transcrição registrada)')}</div>
    </details>
  `;
  document.getElementById('back-link').addEventListener('click', ()=> setView('patientDetail', {patientId}));
  document.getElementById('save-report-edit').addEventListener('click', async ()=>{
    report.report = document.getElementById('report-editor').value;
    report.reviewed = document.getElementById('reviewed-check').checked;
    await saveReports(patientId, reports);
    showToast('Relatório salvo.');
  });
  document.getElementById('reviewed-check').addEventListener('change', async (e)=>{
    report.reviewed = e.target.checked;
    await saveReports(patientId, reports);
  });
  document.getElementById('delete-report').addEventListener('click', async ()=>{
    if(!confirm('Excluir este relatório permanentemente? Esta ação não pode ser desfeita.')) return;
    const updated = reports.filter(r=>r.id!==reportId);
    await saveReports(patientId, updated);
    showToast('Relatório excluído.');
    setView('patientDetail', {patientId});
  });
  document.getElementById('export-word').addEventListener('click', ()=>{
    exportWord(report.title, document.getElementById('report-editor').value, patient.name, report.date);
  });
  document.getElementById('export-pdf').addEventListener('click', ()=>{
    exportPdf(report.title, document.getElementById('report-editor').value, patient.name, report.date);
  });
}

/* ---------------- Export helpers ---------------- */
function reportHtmlBody(title, bodyText, patientName, dateStr){
  const paragraphs = bodyText.split('\n').map(line=>{
    line = line.trim();
    if(!line) return '<p>&nbsp;</p>';
    return `<p>${escapeHtml(line)}</p>`;
  }).join('\n');
  return `
    <h1 style="font-family:Georgia,serif;color:#2F4B3C;">${escapeHtml(title)}</h1>
    <p><strong>Paciente:</strong> ${escapeHtml(patientName)} &nbsp;|&nbsp; <strong>Data:</strong> ${fmtDate(dateStr)}</p>
    <p><strong>Profissional:</strong> ${escapeHtml(state.professionalName || '')}</p>
    <hr>
    ${paragraphs}
  `;
}

function exportWord(title, bodyText, patientName, dateStr){
  const html = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>${escapeHtml(title)}</title></head>
    <body style="font-family:Calibri, Arial, sans-serif; font-size:12pt;">
      ${reportHtmlBody(title, bodyText, patientName, dateStr)}
    </body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${sanitizeFilename(title)}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportPdf(title, bodyText, patientName, dateStr){
  const w = window.open('', '_blank');
  w.document.write(`
    <html><head><title>${escapeHtml(title)}</title>
    <style>body{font-family:Georgia,serif; padding:40px; color:#232E27; line-height:1.6;} h1{color:#2F4B3C;}</style>
    </head><body>${reportHtmlBody(title, bodyText, patientName, dateStr)}</body></html>
  `);
  w.document.close();
  setTimeout(()=> w.print(), 300);
}

function sanitizeFilename(str){
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9\- ]/g,'').trim().replace(/\s+/g,'_') || 'relatorio';
}

/* ---------------- New session (recording + transcription) ---------------- */
let recognition = null;
let mediaRecorder = null;
let audioChunks = [];
let liveTranscript = '';
let isRecording = false;
let recTimerStart = null;
let recTimerInterval = null;
let uploadedAudioUrl = null;
let uploadRecognition = null;
let isTranscribingUpload = false;

function updateRecTimer(){
  const el = document.getElementById('rec-timer');
  if(!el || !recTimerStart) return;
  const secs = Math.floor((Date.now() - recTimerStart) / 1000);
  const mm = String(Math.floor(secs/60)).padStart(2,'0');
  const ss = String(secs%60).padStart(2,'0');
  el.textContent = `Gravando... ${mm}:${ss}`;
}

function updateTranscriptBox(){
  const box = document.getElementById('transcript-box');
  if(box) box.textContent = liveTranscript || '(a transcrição aparecerá aqui durante a gravação)';
}

function currentFullTranscript(){
  const manual = document.getElementById('manual-transcript').value.trim();
  const combined = [liveTranscript.trim(), manual].filter(Boolean).join('\n\n');
  return combined;
}

function wireNewSessionEvents(){
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supportNote = document.getElementById('speech-support-note');
  if(!SpeechRecognitionAPI){
    supportNote.textContent = 'Seu navegador não tem suporte à transcrição automática (funciona melhor no Chrome ou Edge). Você ainda pode colar a transcrição manualmente abaixo.';
    document.getElementById('start-rec').disabled = true;
  } else {
    supportNote.textContent = 'A transcrição automática funciona melhor no Chrome/Edge, em ambiente silencioso.';
  }

  document.getElementById('manual-transcript').addEventListener('input', refreshGenerateButton);

  document.getElementById('start-rec').addEventListener('click', async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.start();

      recognition = new SpeechRecognitionAPI();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onresult = (event)=>{
        for(let i=event.resultIndex; i<event.results.length; i++){
          if(event.results[i].isFinal){
            liveTranscript += event.results[i][0].transcript + ' ';
            updateTranscriptBox();
            refreshGenerateButton();
          }
        }
      };
      recognition.onerror = (e)=>{ console.warn('speech recognition error', e); };
      recognition.onend = ()=>{ if(isRecording) recognition.start(); };
      recognition.start();

      isRecording = true;
      recTimerStart = Date.now();
      recTimerInterval = setInterval(updateRecTimer, 1000);
      document.getElementById('start-rec').disabled = true;
      document.getElementById('stop-rec').disabled = false;
      document.getElementById('rec-status').style.display = 'flex';
      updateRecTimer();
    } catch(err){
      showToast('Não foi possível acessar o microfone.');
    }
  });

  document.getElementById('stop-rec').addEventListener('click', ()=>{
    isRecording = false;
    if(recognition) recognition.stop();
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    clearInterval(recTimerInterval);
    document.getElementById('start-rec').disabled = false;
    document.getElementById('stop-rec').disabled = true;
    document.getElementById('rec-status').style.display = 'none';
    refreshGenerateButton();
  });

  document.getElementById('generate-report').addEventListener('click', async ()=>{
    const transcript = currentFullTranscript();
    if(!transcript){ showToast('Não há transcrição ainda.'); return; }
    const btn = document.getElementById('generate-report');
    btn.disabled = true;
    btn.textContent = 'Gerando esboço...';
    try{
      const patientSelect = document.getElementById('session-patient');
      const patientName = patientSelect.options[patientSelect.selectedIndex]?.text || 'Paciente';
      const prompt = `Você é um assistente que ajuda terapeutas a redigir esboços de relatório de sessão clínica em português do Brasil, a partir da transcrição de um atendimento.

Paciente: ${patientName}
Transcrição da sessão:
"""
${transcript}
"""

Gere um esboço de relatório de sessão, organizado com os seguintes tópicos:
1. Resumo da sessão
2. Temas abordados
3. Observações clínicas
4. Encaminhamentos / plano para próxima sessão

Escreva em tom profissional, objetivo e neutro. Não invente informações que não estejam na transcrição. Este é apenas um esboço que o profissional vai revisar e editar antes de finalizar.`;
      const result = await callClaude(prompt);
      document.getElementById('draft-report').value = result;
      document.getElementById('report-result').style.display = 'block';
    } catch(err){
      showToast('Erro ao gerar esboço. Tente novamente.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Gerar esboço de relatório com IA';
    }
  });

  document.getElementById('save-session-report').addEventListener('click', async ()=>{
    const patientId = document.getElementById('session-patient').value;
    if(!patientId){ showToast('Selecione um paciente.'); return; }
    const title = document.getElementById('session-title').value.trim() || 'Sessão';
    const date = document.getElementById('session-date').value || todayISO();
    const reportText = document.getElementById('draft-report').value;
    const transcript = currentFullTranscript();
    const reports = state.reportsByPatient[patientId] || await loadReports(patientId);
    reports.push({ id: uid(), title, date, transcript, report: reportText, createdAt: new Date().toISOString() });
    await saveReports(patientId, reports);
    showToast('Relatório salvo com sucesso.');
    setView('patientDetail', { patientId });
  });
}

function wireAudioUploadEvents(){
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  const fileInput = document.getElementById('audio-upload');
  const player = document.getElementById('audio-player');
  const transcribeBtn = document.getElementById('transcribe-upload-btn');
  const stopBtn = document.getElementById('stop-upload-transcribe-btn');
  const discardBtn = document.getElementById('discard-upload-btn');

  if(!SpeechRecognitionAPI){
    transcribeBtn.disabled = true;
    transcribeBtn.title = 'Transcrição automática não é suportada neste navegador.';
  }

  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(uploadedAudioUrl) URL.revokeObjectURL(uploadedAudioUrl);
    uploadedAudioUrl = URL.createObjectURL(file);
    player.src = uploadedAudioUrl;
    player.style.display = 'block';
    transcribeBtn.disabled = !SpeechRecognitionAPI;
    document.getElementById('transcribe-whisper-btn').disabled = false;
    discardBtn.style.display = 'inline-block';
  });

  document.getElementById('transcribe-whisper-btn').addEventListener('click', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    await runWhisperTranscription(file);
  });

  discardBtn.addEventListener('click', ()=> discardUploadedAudio());

  transcribeBtn.addEventListener('click', async ()=>{
    if(!uploadedAudioUrl) return;
    try{
      await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch(err){
      showToast('É preciso permitir o microfone para transcrever a reprodução.');
      return;
    }
    uploadRecognition = new SpeechRecognitionAPI();
    uploadRecognition.lang = 'pt-BR';
    uploadRecognition.continuous = true;
    uploadRecognition.interimResults = false;
    uploadRecognition.onresult = (event)=>{
      for(let i=event.resultIndex; i<event.results.length; i++){
        if(event.results[i].isFinal){
          liveTranscript += event.results[i][0].transcript + ' ';
          updateTranscriptBox();
          refreshGenerateButton();
        }
      }
    };
    uploadRecognition.onerror = (e)=> console.warn('upload recognition error', e);
    uploadRecognition.onend = ()=>{ if(isTranscribingUpload) uploadRecognition.start(); };

    isTranscribingUpload = true;
    uploadRecognition.start();
    player.play();
    transcribeBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';

    player.onended = ()=> finishUploadTranscription();
  });

  stopBtn.addEventListener('click', ()=> finishUploadTranscription());
}

let whisperPipelinePromise = null;

function setWhisperStatus(msg){
  const el = document.getElementById('whisper-status');
  if(!el) return;
  el.style.display = msg ? 'block' : 'none';
  el.textContent = msg;
}

async function getWhisperPipeline(){
  if(whisperPipelinePromise) return whisperPipelinePromise;
  whisperPipelinePromise = (async ()=>{
    setWhisperStatus('Carregando biblioteca de IA...');
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0');
    env.allowLocalModels = false;
    setWhisperStatus('Baixando modelo Whisper (pode levar um tempo na primeira vez)...');
    const pipe = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', {
      progress_callback: (p)=>{
        if(p && p.status === 'progress' && p.file){
          const pct = p.progress ? Math.round(p.progress) : 0;
          setWhisperStatus(`Baixando ${p.file}... ${pct}%`);
        }
      }
    });
    return pipe;
  })();
  return whisperPipelinePromise;
}

async function decodeAudioTo16kMono(file){
  const arrayBuffer = await file.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const tempCtx = new AudioCtx();
  const decoded = await tempCtx.decodeAudioData(arrayBuffer.slice(0));
  tempCtx.close();

  const targetRate = 16000;
  const offline = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const source = offline.createBufferSource();
  source.buffer = decoded;
  source.connect(offline.destination);
  source.start(0);
  const rendered = await offline.startRendering();
  return rendered.getChannelData(0);
}

async function runWhisperTranscription(file){
  const btn = document.getElementById('transcribe-whisper-btn');
  btn.disabled = true;
  try{
    const pipe = await getWhisperPipeline();
    setWhisperStatus('Processando áudio...');
    const audioData = await decodeAudioTo16kMono(file);
    setWhisperStatus('Transcrevendo (pode levar alguns minutos)...');
    const result = await pipe(audioData, { language: 'portuguese', task: 'transcribe', chunk_length_s: 30, stride_length_s: 5 });
    const text = (result && result.text || '').trim();
    if(text){
      liveTranscript += text + ' ';
      updateTranscriptBox();
      refreshGenerateButton();
      setWhisperStatus('Transcrição concluída com Whisper local. Descartando áudio...');
      showToast('Transcrição via Whisper concluída.');
      discardUploadedAudio();
      setTimeout(()=> setWhisperStatus(''), 2500);
    } else {
      setWhisperStatus('Não foi possível extrair texto do áudio.');
    }
  } catch(err){
    console.error('whisper error', err);
    setWhisperStatus('Não deu certo: o Whisper local provavelmente foi bloqueado pela segurança deste ambiente. Use a Opção B (tocar e ouvir pelo microfone) abaixo.');
    whisperPipelinePromise = null;
  } finally {
    btn.disabled = false;
  }
}

function finishUploadTranscription(){
  isTranscribingUpload = false;
  if(uploadRecognition) uploadRecognition.stop();
  const player = document.getElementById('audio-player');
  if(player) player.pause();
  const transcribeBtn = document.getElementById('transcribe-upload-btn');
  const stopBtn = document.getElementById('stop-upload-transcribe-btn');
  if(transcribeBtn) transcribeBtn.style.display = 'inline-block';
  if(stopBtn) stopBtn.style.display = 'none';
  showToast('Transcrição concluída. O áudio pode ser descartado.');
  discardUploadedAudio();
}

function discardUploadedAudio(){
  if(uploadedAudioUrl){ URL.revokeObjectURL(uploadedAudioUrl); uploadedAudioUrl = null; }
  const fileInput = document.getElementById('audio-upload');
  const player = document.getElementById('audio-player');
  const discardBtn = document.getElementById('discard-upload-btn');
  const transcribeBtn = document.getElementById('transcribe-upload-btn');
  const whisperBtn = document.getElementById('transcribe-whisper-btn');
  if(fileInput) fileInput.value = '';
  if(player){ player.src=''; player.style.display = 'none'; }
  if(discardBtn) discardBtn.style.display = 'none';
  if(transcribeBtn) transcribeBtn.disabled = true;
  if(whisperBtn) whisperBtn.disabled = true;
}

function refreshGenerateButton(){
  const btn = document.getElementById('generate-report');
  if(!btn) return;
  btn.disabled = !currentFullTranscript();
}

/* ---------------- Period report ---------------- */
function renderPeriod(){
  const main = document.getElementById('main');
  const patientOptions = state.patients.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
  main.innerHTML = `
    <div class="eyebrow-free-header">
      <h1>Relatório por período</h1>
      <p class="muted">Reúna os relatórios de um paciente em um intervalo de datas e gere um resumo geral.</p>
    </div>
    <div class="card">
      <div class="field">
        <label>Paciente</label>
        <select id="period-patient">
          <option value="">Selecione...</option>
          ${patientOptions}
        </select>
      </div>
      <div class="row">
        <div class="field" style="flex:1;">
          <label>De</label>
          <input type="date" id="period-start">
        </div>
        <div class="field" style="flex:1;">
          <label>Até</label>
          <input type="date" id="period-end" value="${todayISO()}">
        </div>
      </div>
      <button class="btn" id="load-period">Buscar atendimentos</button>
    </div>
    <div id="period-sessions"></div>
    <div id="period-summary-card" style="display:none;" class="card">
      <p class="muted" style="margin-bottom:10px;">⚠️ Gerado por IA a partir dos relatórios individuais — revise antes de exportar.</p>
      <label>Resumo geral do período (editável)</label>
      <textarea id="period-summary" rows="14"></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn secondary" id="export-period-word">Exportar Word (.doc)</button>
        <button class="btn secondary" id="export-period-pdf">Exportar PDF</button>
      </div>
    </div>
  `;

  document.getElementById('load-period').addEventListener('click', async ()=>{
    const patientId = document.getElementById('period-patient').value;
    if(!patientId){ showToast('Selecione um paciente.'); return; }
    const start = document.getElementById('period-start').value;
    const end = document.getElementById('period-end').value;
    const reports = state.reportsByPatient[patientId] || await loadReports(patientId);
    const filtered = reports.filter(r=>{
      if(start && r.date < start) return false;
      if(end && r.date > end) return false;
      return true;
    }).sort((a,b)=> new Date(a.date)-new Date(b.date));

    const container = document.getElementById('period-sessions');
    if(filtered.length===0){
      container.innerHTML = `<div class="card empty-state">Nenhum relatório encontrado nesse período.</div>`;
      document.getElementById('period-summary-card').style.display = 'none';
      return;
    }
    container.innerHTML = `
      <div class="card">
        <p class="muted">${filtered.length} atendimento(s) encontrado(s).</p>
        ${filtered.map(r=>`<div class="report-item" style="cursor:default;"><div class="title">${escapeHtml(r.title)}</div><div class="date">${fmtDate(r.date)}</div></div>`).join('')}
        <button class="btn accent" id="generate-period-summary" style="margin-top:10px;">Gerar relatório geral com IA</button>
      </div>
    `;
    document.getElementById('generate-period-summary').addEventListener('click', async ()=>{
      const btn = document.getElementById('generate-period-summary');
      btn.disabled = true;
      btn.textContent = 'Gerando...';
      try{
        const patient = state.patients.find(p=>p.id===patientId);
        const combined = filtered.map(r=> `Sessão de ${fmtDate(r.date)} — ${r.title}:\n${r.report}`).join('\n\n---\n\n');
        const prompt = `Você é um assistente que ajuda terapeutas a redigir relatórios gerais de acompanhamento em português do Brasil, a partir de vários relatórios individuais de sessão de um mesmo paciente.

Paciente: ${patient.name}
Período: ${start || 'início'} a ${end || 'hoje'}

Relatórios individuais das sessões no período:
"""
${combined}
"""

Gere um relatório geral e coeso do período, cobrindo:
1. Panorama geral do acompanhamento
2. Evolução e padrões observados ao longo das sessões
3. Temas recorrentes
4. Situação atual e recomendações para continuidade

Tom profissional, objetivo. Não invente informações que não estejam nos relatórios fornecidos.`;
        const result = await callClaude(prompt);
        document.getElementById('period-summary').value = result;
        document.getElementById('period-summary-card').style.display = 'block';
        document.getElementById('period-summary-card').dataset.patientName = patient.name;
      } catch(err){
        showToast('Erro ao gerar relatório geral.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Gerar relatório geral com IA';
      }
    });
  });

  document.getElementById('export-period-word').addEventListener('click', ()=>{
    const patientId = document.getElementById('period-patient').value;
    const patient = state.patients.find(p=>p.id===patientId);
    const start = document.getElementById('period-start').value || '';
    const end = document.getElementById('period-end').value || todayISO();
    exportWord(`Relatório geral — período`, document.getElementById('period-summary').value, patient?.name || '', end);
  });
  document.getElementById('export-period-pdf').addEventListener('click', ()=>{
    const patientId = document.getElementById('period-patient').value;
    const patient = state.patients.find(p=>p.id===patientId);
    const end = document.getElementById('period-end').value || todayISO();
    exportPdf(`Relatório geral — período`, document.getElementById('period-summary').value, patient?.name || '', end);
  });
}

init();
